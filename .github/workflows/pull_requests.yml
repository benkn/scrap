name: Pull Request Workflow

on:
  # Run for every pull request, regardless of the target branch
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  devops-vars:
    uses: VirdocsSoftware/github-actions/.github/workflows/devops-vars.yml@v2

  echo-vars:
    runs-on: ubuntu-latest
    needs: [devops-vars]
    steps:
      - name: Echo vars
        run: |
          echo "DEVOPS_BRANCH_ENV_NAME=${{ needs.devops-vars.outputs.DEVOPS_BRANCH_ENV_NAME }}"
          echo "DEVOPS_TRIGGER_DEPLOYMENT=${{ needs.devops-vars.outputs.DEVOPS_TRIGGER_DEPLOYMENT }}"

  do-the-dev-thing:
    runs-on: ubuntu-latest
    needs: [devops-vars]
    # only run on feature branches targeting develop branch or the develop branch itself
    if: ${{ github.ref_name == 'main' || (needs.devops-vars.outputs.DEVOPS_TRIGGER_DEPLOYMENT == 'true' &&  github.event.pull_request.base.ref == 'main') }}
    steps:
      - name: Run a one-line script
        run: echo Hello world!

